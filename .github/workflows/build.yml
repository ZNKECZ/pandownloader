name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf \
            libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36"

      - name: Pre-accept Android SDK licenses
        run: |
          LDIR="$HOME/.buildozer/android/platform/android-sdk/licenses"
          mkdir -p "$LDIR"
          printf "%s\n" "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$LDIR/android-sdk-license"
          printf "%s\n" "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$LDIR/android-sdk-preview-license"
          printf "%s\n" "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" \
            > "$LDIR/google-gdk-license"
          printf "%s\n" "859f317696f67ef3d7f30a50a5560e7834b43903" \
            > "$LDIR/android-sdk-arm-dbt-license"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pandownloader-apk
          path: bin/*.apk
